# PARTE DEL EXAMEN: complete el Pipeline.
name: Pipeline de CI/CD

on:
  push:
    branches:
      - main

platforms:
  ubuntu-latest

job:
  construccion:
    steps:
    # TODO: configurar Node.js
      - name: Checkout del código
        uses: actions/checkout@v2

      - name: Configurar Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'
# TODO: instalar dependencias
      - name: Instalar dependencias
        run: npm install

# TODO: ejecutar pruebas
      - name: Ejecutar pruebas
        run: npm test


